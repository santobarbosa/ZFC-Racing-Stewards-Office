<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZFC Racing — Stewards Office</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,300;0,400;0,600;0,700;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="shell" style="display:none;">
  <div id="sidebar">
    <div id="brand">
      <div class="mark">ZFC<span>RACING</span></div>
      <div class="sub">Stewards Office</div>
    </div>
    <nav class="mainnav" id="mainnav"></nav>
    <div id="sidebar-foot"><div id="accountBadge"></div></div>
  </div>
  <div id="main"></div>
</div>
<div id="loadingScreen" class="loading">ZFC RACING — LADE SYSTEM …</div>
<section id="loginScreen" aria-label="Anmeldung">
  <form class="login-panel" onsubmit="event.preventDefault();handleLogin();">
    <div class="login-topline"><span class="eyebrow">ZFC Racing</span><span class="login-access"><i></i> Secure access</span></div>
    <div class="login-heading">
      <div class="login-monogram" aria-hidden="true">ZFC</div>
      <p class="login-subtitle">Interner Zugang</p>
      <h1>Stewards<br><span>Office</span></h1>
      <p class="login-intro">Melde dich mit deinem autorisierten Konto an.</p>
    </div>
    <div class="login-fields">
      <div class="field"><label for="loginEmail">E-Mail</label><input id="loginEmail" type="email" autocomplete="username" placeholder="name@zfc-racing.de" required></div>
      <div class="field"><label for="loginPassword">Passwort</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Dein Passwort" required></div>
    </div>
    <p id="loginMessage" class="login-message" role="alert"></p>
    <button class="btn primary login-submit" type="submit">Anmelden <span aria-hidden="true">→</span></button>
    <p class="footer-note">Benutzerkonten werden durch Tier 3 eingerichtet.</p>
  </form>
</section>
<div id="caseOpeningOverlay" class="case-opening-overlay" hidden aria-live="polite"></div>

<div id="printArea"></div>

<script src="./app.js"></script>
</body>
</html>
